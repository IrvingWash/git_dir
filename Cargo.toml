[package]
name = "git_dir"
version = "0.1.0"
edition = "2024"
description = "Repo directory downloader"
exclude = [".github"]
homepage = "https://github.com/IrvingWash/git_dir"
repository = "https://github.com/IrvingWash/git_dir.git"
readme = "README.md"
license = "MIT"
publish = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
url = "2.5.8"
walkdir = "2.5.0"
zip = "9.2.2"
tokio = { version = "1", features = ["full"] }
